<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Westina’s Cantina — a restaurant-style family recipe menu and weekly meal planner.">
  <title>Westina’s Cantina</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="hero"><h1>Westina’s Cantina</h1></header>

  <main class="shell">
    <section class="planner-intro" aria-labelledby="planner-heading">
      <div>
        <span class="section-kicker">Sunday planning</span>
        <h2 id="planner-heading">This week</h2>
        <p class="planner-lede">Start with a proposed week, then drag dishes between days and meals until it feels right.</p>
      </div>
      <div class="planner-actions">
        <button id="propose-week" class="primary-button" type="button">Propose a week</button>
        <button id="clear-plan" class="clear" type="button">Clear</button>
      </div>
    </section>
    <p id="planner-status" class="planner-status" aria-live="polite"></p>

    <section id="week-calendar" class="week-calendar" aria-label="Weekly meal plan"></section>

    <details id="menu-drawer" class="menu-drawer">
      <summary class="menu-toggle"><span class="menu-toggle-label">Browse menu</span><small class="menu-toggle-hint">Open menu</small></summary>
      <section class="menu-tools" aria-label="Menu controls">
        <div class="dayparts" role="tablist" aria-label="Daypart">
          <button class="daypart active" data-slot="dinner" role="tab" aria-selected="true">Dinner</button>
          <button class="daypart" data-slot="lunch" role="tab" aria-selected="false">Lunch</button>
          <button class="daypart" data-slot="breakfast" role="tab" aria-selected="false">Breakfast</button>
        </div>
        <div class="view-switcher" role="tablist" aria-label="Menu organization">
          <button class="view-button active" data-view="dishes" role="tab" aria-selected="true">Dishes</button>
          <button class="view-button" data-view="components" role="tab" aria-selected="false">Components / Sides</button>
        </div>
        <label class="search"><span>Find a recipe</span><input id="search" type="search" placeholder="Try kale, noodles, chicken…"></label>
        <button id="clear-search" class="clear" type="button">Clear</button>
      </section>
      <div class="menu-heading">
        <div><span class="section-kicker">Recipe menu</span><h2 id="menu-heading">Dishes</h2></div>
        <p id="count" class="count"></p>
      </div>
      <p id="menu-note" class="menu-note"></p>
      <div id="menu" class="menu-sections" aria-live="polite"></div>
      <section id="empty" class="empty" hidden><h2>No recipes found</h2><p>Try another search, menu organization, or daypart.</p></section>
    </details>
  </main>

  <dialog id="add-dialog" class="add-dialog">
    <form method="dialog" id="add-form">
      <h2>Add to the week</h2>
      <p id="add-recipe-name"></p>
      <input id="add-recipe-id" type="hidden">
      <label>Day<select id="add-day"></select></label>
      <label>Meal<select id="add-meal"><option value="breakfast">Breakfast</option><option value="lunch">Lunch</option><option value="dinner" selected>Dinner</option></select></label>
      <div class="dialog-actions"><button class="clear" value="cancel">Cancel</button><button class="primary-button" value="add">Add to plan</button></div>
    </form>
  </dialog>

  <script src="assets/app.js"></script>
</body>
</html>
